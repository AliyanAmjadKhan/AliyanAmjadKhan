<svg viewBox="0 0 1000 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad3L" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbfcff"/>
      <stop offset="50%" stop-color="#eef1fc"/>
      <stop offset="100%" stop-color="#f6f2fd"/>
    </linearGradient>
    <clipPath id="frame3L"><rect width="1000" height="140" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame3L)">
    <rect width="1000" height="140" fill="url(#bgGrad3L)"/>

    <g stroke="#dfe3f5" stroke-width="1">
      <line x1="0" y1="0" x2="1000" y2="0"/>
    </g>

    <line x1="0" y1="1" x2="1000" y2="1" stroke="#155EEF" stroke-width="2" opacity="0.75">
      <animate attributeName="x1" values="-300;1000" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1300" dur="4s" repeatCount="indefinite"/>
    </line>

    <text x="500" y="72" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#0f1222">
      thanks for scrolling this far, that alone made my day
    </text>

    <text x="500" y="102" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#6b76a0">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
      aliyanamjadkhan.netlify.app  &#183;  linkedin.com/in/aliyanamjadkhan
    </text>
  </g>

  <rect x="0.5" y="0.5" width="999" height="139" rx="14" fill="none" stroke="#dfe3f5" stroke-width="1"/>
</svg>
