<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060a">
        <animate attributeName="stop-color" values="#05060a;#0a0f1e;#05060a" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#0d1526">
        <animate attributeName="stop-color" values="#0d1526;#141c33;#0d1526" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#05060a">
        <animate attributeName="stop-color" values="#05060a;#0e0a1e;#05060a" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="orbBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2E9EF7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2E9EF7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8A2BE2" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8A2BE2" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#1b2436" stroke-width="1"/>
    </pattern>

    <clipPath id="frame">
      <rect x="0" y="0" width="1000" height="300" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="300" fill="url(#bgGrad)"/>

    <g opacity="0.35">
      <rect width="1000" height="300" fill="url(#grid)">
        <animateTransform attributeName="transform" type="translate" values="0,0;42,42;0,0" dur="14s" repeatCount="indefinite"/>
      </rect>
    </g>

    <circle cx="120" cy="60" r="130" fill="url(#orbBlue)" filter="url(#soft)">
      <animateMotion path="M0,0 C 40,30 60,-30 10,10 C -30,50 20,60 0,0" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="240" r="150" fill="url(#orbPurple)" filter="url(#soft)">
      <animateMotion path="M0,0 C -50,-20 -20,40 -60,0 C -20,-40 30,-30 0,0" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="50" r="70" fill="url(#orbBlue)" filter="url(#soft)" opacity="0.5">
      <animateMotion path="M0,0 C 20,20 -30,10 -10,-20 C 10,-40 30,0 0,0" dur="12s" repeatCount="indefinite"/>
    </circle>

    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="60" y="140" font-size="58" font-weight="700" fill="#f2f5fa" letter-spacing="1">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.05;0.35;1" dur="9s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,26;0,26;0,0;0,0" keyTimes="0;0.05;0.35;1" dur="9s" repeatCount="indefinite"/>
        Aliyan Amjad Khan
      </text>

      <text x="61" y="178" font-size="21" fill="#8fa3c2" letter-spacing="3">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.18;0.45;1" dur="9s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,14;0,14;0,0;0,0" keyTimes="0;0.18;0.45;1" dur="9s" repeatCount="indefinite"/>
        FULL STACK DEVELOPER  /  SOFTWARE ENGINEER
      </text>
    </g>

    <rect x="61" y="196" width="0" height="3" fill="#2E9EF7">
      <animate attributeName="width" values="0;0;300;300" keyTimes="0;0.35;0.6;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#2E9EF7;#8A2BE2;#2E9EF7" dur="9s" repeatCount="indefinite"/>
    </rect>

    <g font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="17" fill="#5eead4">
      <text x="61" y="240" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.30;0.33;1" dur="9s" repeatCount="indefinite"/>
        building products end to end
      </text>
      <text x="61" y="240" opacity="0">
        <animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;0.33;0.36;0.40;0.63;0.66;1" dur="9s" repeatCount="indefinite"/>
        shipping with node, react &amp; python
      </text>
      <text x="61" y="240" opacity="0">
        <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.66;0.69;0.73;0.97;1" dur="9s" repeatCount="indefinite"/>
        currently levelling up the mern stack
      </text>
      <rect x="0" y="226" width="10" height="18" fill="#5eead4">
        <animate attributeName="x" values="440;440" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0;1;0;1;0;1;0" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g stroke="#2E9EF7" stroke-width="1.4" fill="none" opacity="0.55">
      <path d="M 700 40 L 760 40 L 760 90 L 820 90">
        <animate attributeName="stroke-dasharray" values="0,300;300,0" dur="4s" repeatCount="indefinite"/>
      </path>
      <circle cx="700" cy="40" r="3.5" fill="#2E9EF7" stroke="none"/>
      <circle cx="820" cy="90" r="3.5" fill="#8A2BE2" stroke="none"/>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="999" height="299" rx="14" fill="none" stroke="#1f2a44" stroke-width="1"/>
</svg>
